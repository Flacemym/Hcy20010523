<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>给你的一句话</title>
<style>
:root{
  --ink:#3e2231;
  --ink-soft:#6b4356;
  --pink:#ff5f87;
  --plum:#b83f74;
  --gold:#f7b955;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  min-height:100vh;
  overflow:hidden;
  color:var(--ink);
  font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC","Source Han Sans SC",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
  background:
    radial-gradient(55% 45% at 8% 4%, #fffaf3 0%, rgba(255,250,243,0) 62%),
    radial-gradient(65% 55% at 92% 10%, #ffe9f2 0%, rgba(255,233,242,0) 66%),
    radial-gradient(95% 85% at 50% 112%, #ffe1ee 0%, rgba(255,225,238,0) 72%),
    linear-gradient(158deg,#fff6ea 0%,#fff0f5 46%,#ffe4f2 100%);
}
.blob{
  position:fixed;
  border-radius:50%;
  filter:blur(46px);
  opacity:.55;
  pointer-events:none;
  animation:drift 18s ease-in-out infinite alternate;
}
.b1{width:38vmax;height:38vmax;left:-12vmax;top:-14vmax;background:radial-gradient(circle,#ffd9a8 0%,rgba(255,217,168,0) 70%)}
.b2{width:34vmax;height:34vmax;right:-10vmax;top:8vmax;background:radial-gradient(circle,#ffc7de 0%,rgba(255,199,222,0) 70%);animation-duration:22s}
.b3{width:44vmax;height:44vmax;left:24vw;bottom:-24vmax;background:radial-gradient(circle,#ffe0b8 0%,rgba(255,224,184,0) 70%);animation-duration:26s}
@keyframes drift{
  from{transform:translate3d(0,0,0) scale(1)}
  to{transform:translate3d(3vmax,-2vmax,0) scale(1.08)}
}

.particles{position:fixed;inset:0;pointer-events:none;z-index:1;overflow:hidden}
.particle{
  position:absolute;
  bottom:-10vh;
  opacity:0;
  will-change:transform,opacity;
  animation:floatUp linear infinite;
  filter:drop-shadow(0 8px 12px rgba(206,120,150,.22));
}
@keyframes floatUp{
  0%{transform:translateY(0) rotate(0deg);opacity:0}
  12%{opacity:.9}
  80%{opacity:.75}
  100%{transform:translateY(-114vh) rotate(var(--rot));opacity:0}
}

.stage{
  position:relative;
  z-index:2;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:clamp(18px,3.2vh,34px);
  padding:6vh 5vw 5vh;
  text-align:center;
}

.lines{display:flex;flex-direction:column;align-items:center;gap:clamp(6px,1.4vh,16px)}
.line{display:flex;flex-wrap:wrap;justify-content:center;align-items:baseline;line-height:1.18}
.l1{font-size:clamp(25px,5.1vw,52px);font-weight:600;letter-spacing:.04em;color:var(--ink-soft)}
.l2{font-size:clamp(29px,6.2vw,64px);font-weight:800;letter-spacing:.02em}
.l3{font-size:clamp(16px,3.2vw,28px);font-weight:600;letter-spacing:.03em}

.seg{display:inline-block;position:relative}
.seg.mark{
  background-image:linear-gradient(transparent 60%, rgba(247,185,85,.62) 60%);
  background-repeat:no-repeat;
  background-position:left 86%;
  background-size:0% 100%;
  color:var(--plum);
  animation:sweep .8s cubic-bezier(.25,.9,.3,1) forwards;
}
@keyframes sweep{to{background-size:100% 100%}}

.seg.bubble{
  padding:.14em .62em .2em;
  border-radius:999px;
  background:rgba(255,255,255,.72);
  box-shadow:0 10px 26px rgba(196,96,132,.18), inset 0 0 0 1px rgba(255,255,255,.9);
  color:var(--pink);
  opacity:0;
  transform:rotate(-2deg);
  animation:bubbleIn .72s cubic-bezier(.2,1.4,.4,1) forwards, wobble 3.6s ease-in-out infinite;
}
@keyframes bubbleIn{
  0%{opacity:0;transform:rotate(-9deg) translateY(14px) scale(.86)}
  70%{opacity:1;transform:rotate(-1deg) translateY(0) scale(1.03)}
  100%{opacity:1;transform:rotate(-2deg) scale(1)}
}
@keyframes wobble{
  0%,100%{transform:rotate(-2deg)}
  50%{transform:rotate(-.6deg) translateY(-2px)}
}

.ch{
  display:inline-block;
  transform-origin:50% 82%;
  will-change:transform,opacity;
  text-shadow:0 2px 0 rgba(255,255,255,.55), 0 12px 26px rgba(190,105,140,.16);
}
@keyframes pop{
  0%{opacity:0;transform:translateY(.55em) scale(.32) rotate(var(--rot));filter:blur(7px)}
  55%{opacity:1;transform:translateY(-.16em) scale(1.14) rotate(calc(var(--rot) * -.35));filter:blur(0)}
  76%{transform:translateY(.03em) scale(.97) rotate(calc(var(--rot) * .5))}
  100%{opacity:1;transform:translateY(0) scale(1) rotate(0deg)}
}
@keyframes bob{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-.09em)}
}

.replay{
  border:0;
  margin-top:-8px;
  padding:10px 20px;
  border-radius:999px;
  font-family:inherit;
  font-size:13px;
  letter-spacing:.14em;
  color:#a0536f;
  background:rgba(255,255,255,.62);
  box-shadow:0 8px 22px rgba(190,110,140,.14), inset 0 0 0 1px rgba(255,255,255,.85);
  cursor:pointer;
  opacity:0;
  transition:transform .2s ease, background .2s ease, opacity .5s ease;
}
.replay.show{opacity:1}
.replay:hover{transform:translateY(-2px);background:rgba(255,255,255,.9)}
.replay:active{transform:translateY(0) scale(.98)}

.sparkle{
  position:fixed;
  color:#ffd68a;
  font-size:20px;
  pointer-events:none;
  opacity:.7;
  animation:twinkle 3.4s ease-in-out infinite;
  z-index:1;
}
@keyframes twinkle{
  0%,100%{opacity:.15;transform:scale(.7) rotate(0)}
  50%{opacity:.85;transform:scale(1.15) rotate(18deg)}
}

@media (prefers-reduced-motion: reduce){
  .particle,.blob,.sparkle,.ch,.seg.bubble,.seg.mark{animation:none !important}
  .seg.bubble{opacity:1;transform:rotate(-2deg)}
  .seg.mark{background-size:100% 100%}
  .ch{opacity:1}
}
</style>
</head>
<body>
<div class="blob b1"></div>
<div class="blob b2"></div>
<div class="blob b3"></div>
<div class="particles" id="particles"></div>

<main class="stage">
  <div class="lines" id="lines"></div>
  <button class="replay" id="replay" type="button">再放一遍 ↺</button>
</main>

<script>
(function () {
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var LINES = [
    { cls: 'l1', segs: [ { t: '年龄只是数字，在我心中' } ] },
    { cls: 'l2', segs: [ { t: '你永远是' }, { t: '嘴馋的小孩子', cls: 'mark' }, { t: '！' } ] },
    { cls: 'l3', segs: [ { t: '（但是坏坏的哦！）', cls: 'bubble' } ] }
  ];

  var CHAR_STEP = 0.048;
  var SEG_GAP = 0.07;
  var POP = 0.78;
  var linesEl = document.getElementById('lines');
  var replay = document.getElementById('replay');
  var timers = [];

  function clearTimers() {
    while (timers.length) clearTimeout(timers.pop());
  }

  function build() {
    clearTimers();
    linesEl.innerHTML = '';
    replay.classList.remove('show');

    var t = 0.1;

    LINES.forEach(function (line) {
      var lineEl = document.createElement('div');
      lineEl.className = 'line ' + line.cls;

      line.segs.forEach(function (seg) {
        var segEl = document.createElement('span');
        segEl.className = 'seg' + (seg.cls ? ' ' + seg.cls : '');
        var segStart = t;

        if (seg.cls === 'bubble') {
          segEl.style.animationDelay = segStart + 's, ' + (segStart + 0.7) + 's';
        }
        if (seg.cls === 'mark') {
          segEl.style.animationDelay = (segStart + 0.14) + 's';
        }

        for (var i = 0; i < seg.t.length; i++) {
          var ch = document.createElement('span');
          ch.className = 'ch';
          ch.textContent = seg.t.charAt(i);
          var rot = (Math.random() * 14 - 7).toFixed(1) + 'deg';
          ch.style.setProperty('--rot', rot);
          var d = segStart + i * CHAR_STEP;
          if (reduce) {
            ch.style.opacity = 1;
          } else {
            ch.style.animation =
              'pop ' + POP + 's cubic-bezier(.18,1.45,.4,1) both, bob 3.4s ease-in-out infinite';
            ch.style.animationDelay = d + 's, ' + (d + POP) + 's';
          }
          segEl.appendChild(ch);
        }

        lineEl.appendChild(segEl);
        t = segStart + seg.t.length * CHAR_STEP + SEG_GAP;
      });

      linesEl.appendChild(lineEl);
    });

    timers.push(setTimeout(function () {
      replay.classList.add('show');
    }, reduce ? 0 : (t + 0.35) * 1000));
  }

  function spawnParticles() {
    var box = document.getElementById('particles');
    var emojis = ['🍬', '🍭', '💗', '✨', '🧸', '🍓', '😋'];
    var frag = document.createDocumentFragment();
    for (var i = 0; i < 15; i++) {
      var p = document.createElement('span');
      p.className = 'particle';
      p.textContent = emojis[Math.floor(Math.random() * emojis.length)];
      p.style.left = (Math.random() * 92 + 2) + 'vw';
      p.style.fontSize = (Math.random() * 16 + 17) + 'px';
      p.style.animationDuration = (Math.random() * 9 + 12) + 's';
      p.style.animationDelay = (-Math.random() * 20) + 's';
      p.style.setProperty('--rot', (Math.random() * 40 - 20) + 'deg');
      frag.appendChild(p);
    }
    box.appendChild(frag);
  }

  function spawnSparkles() {
    var frag = document.createDocumentFragment();
    var spots = [[8, 18], [88, 26], [16, 78], [80, 74], [46, 8]];
    spots.forEach(function (s, i) {
      var el = document.createElement('span');
      el.className = 'sparkle';
      el.textContent = '✦';
      el.style.left = s[0] + 'vw';
      el.style.top = s[1] + 'vh';
      el.style.fontSize = (14 + (i % 3) * 5) + 'px';
      el.style.animationDelay = (i * 0.7) + 's';
      frag.appendChild(el);
    });
    document.body.appendChild(frag);
  }

  replay.addEventListener('click', function () {
    build();
  });

  spawnParticles();
  spawnSparkles();
  build();
})();
</script>
</body>
</html>
